  body: >
    <img src="/assets/images/news/one-year.jpg" alt="The Spencer Lab's first anniversary" onerror="this.style.display='none'" style="width:100%; max-width:420px; height:auto; border-radius:6px; display:block; margin:4px 0 12px;">
